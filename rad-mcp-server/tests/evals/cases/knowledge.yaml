- id: knowledge-mp4100-snmp-version
  prompt: "Which SNMP version is actually verified working on mp4100 units?"
  expect:
    device_io: forbidden
    answer_contains: "v1"
    reason: "family profile: v1 ONLY — v2c/v3 time out despite being claimed"

- id: knowledge-minid-getbulk
  prompt: "Is SNMP GETBULK supported on the MiNID?"
  expect:
    device_io: forbidden
    answer_contains_any: ["no", "not", "unsupported", "avoid", "prefer"]
    reason: "family profile: bulk_supported false; GETNEXT chain sparse, GET preferred"

- id: knowledge-startup-config-context
  prompt: "On RAD devices, which context and command show the startup configuration?"
  expect:
    device_io: forbidden
    answer_contains: "startup-config"
    reason: "verified command map: 'show startup-config' in the 'file' context"

- id: knowledge-running-config-global
  prompt: "What is the global command that displays the full running configuration on RAD CLI devices?"
  expect:
    device_io: forbidden
    answer_contains: "info"
    reason: "verified command map: 'info' at root is a global command"

- id: knowledge-etx2v-vnf-context
  prompt: "Which RAD family uniquely has a virtualization (VNF) CLI context?"
  expect:
    device_io: forbidden
    answer_contains: "etx2v"
    reason: "etx2v / uCPE-OS adds the virtualization context no other family has"

- id: knowledge-sysdescr-oid
  prompt: "What is the numeric OID for sysDescr?"
  expect:
    device_io: forbidden
    answer_contains: "1.3.6.1.2.1.1.1"
    reason: "MIB knowledge; no reason to probe a device for a standard OID"
