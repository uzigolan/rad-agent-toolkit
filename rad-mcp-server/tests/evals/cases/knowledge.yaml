# Knowledge cases — retrieval correctness with NO device I/O (plan 00, task 3).
# Every case here must be answerable from the committed corpus alone; any
# transport call is a failure. Facts sourced from:
#   skills/rad-cli-operations/references/verified-commands.md
#   skills/rad-cli-operations/references/family-profiles.yaml

- id: knowledge-mqtt-limit
  prompt: "How many MQTT servers can an ETX-1p have?"
  expect:
    device_io: forbidden
    answer_contains_any: ["2", "two"]  # manual says "Up to two MQTT servers"
    reason: "manual layer answers this; must not touch the device"

- id: knowledge-alarms-command-and-context
  prompt: "Which command shows active alarms on a secflow, and in which CLI context does it live?"
  expect:
    device_io: forbidden
    answer_contains: ["active-alarms", "reporting"]
    reason: "verified command map: 'show active-alarms' in 'configure reporting'"

- id: knowledge-etx2-no-show-resources
  prompt: "Does the etx2 family support the 'show resources' command?"
  expect:
    device_io: forbidden
    answer_contains_any: ["not", "no"]
    reason: "verified command map: 'show resources' is secflow/etx1p only, NOT etx2"

